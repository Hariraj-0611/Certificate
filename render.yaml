services:
  # 1. Django Backend Web Service
  - type: web
    name: certificate-backend
    env: python
    region: oregon
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application --workers=1 --threads=4 --worker-class=gthread --timeout=120 --keep-alive=5 --max-requests=1000 --max-requests-jitter=50"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: BASE_URL
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"

  # 2. React/Vite Frontend Static Site
  - type: web
    name: certificate-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://certificate-jgbq.onrender.com

